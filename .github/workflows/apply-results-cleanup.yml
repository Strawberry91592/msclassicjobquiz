name: Apply Results Cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ github.event.head_commit.message != 'Apply results cleanup' && github.event.head_commit.message != 'Harden results cleanup automation' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Apply requested results-page cleanup
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected 1 occurrence, found {count}')
              p.write_text(text.replace(old, new))

          # index.html: collapse the former two-column results wrapper to the
          # surviving job-match section and remove the redundant playstyle panel.
          replace_once(
              'index.html',
              '''        <div class="result-grid-top">\n          <section class="panel result-panel job-matches-panel">\n''',
              '''        <section class="panel result-panel job-matches-panel">\n'''
          )
          start = Path('index.html').read_text()
          block_start = start.index('          <section class="panel result-panel playstyle-panel">')
          block_end = start.index('        </section>\n        <section class="panel detail-panel">', block_start)
          text = start[:block_start] + start[block_end:]
          Path('index.html').write_text(text)
          replace_once(
              'index.html',
              '<div class="panel-head"><div><h3>Maple World Results</h3><p id="sharedStatsMeta">See how often each 2nd Job has been the final match.</p></div><span class="panel-mark">COMMUNITY COUNTER</span></div>',
              '<div class="panel-head"><div><h3>Community Results</h3><p id="sharedStatsMeta">See how often each 2nd Job has been the final match.</p></div></div>'
          )

          # app.js: remove all DOM output belonging exclusively to the removed panel.
          p = Path('app.js')
          text = p.read_text()
          replace_once('app.js', "    $('coverageText').textContent = '0% of questions answered';\n", '')
          replace_once('app.js', "\n    $('profileBars').innerHTML = `<div class=\"empty-note beginner-note\"><strong>Nothing to read yet.</strong><span>You successfully dodged every single question. Your playstyle remains a mystery.</span></div>;", '')
          replace_once('app.js', "    $('coverageText').textContent = `${result.answered}/${result.total} questions answered`;\n", '')
          start = text.index('\n    const expressedDims = dims.map(')
          end = text.index('\n\n    const strongest =', start)
          removed = text[start:end]
          if "$('profileBars')" not in removed:
              raise SystemExit('app.js: expected profileBars render block was not found')
          p.write_text(text[:start] + text[end:])

          # project-enhancements.js: remove the now-unnecessary DOM rewriter and observer.
          p = Path('project-enhancements.js')
          text = p.read_text()
          start = text.index('\n  function simplifySignalCards()')
          end = text.index('\n\n  // Analytics Engine writes', start)
          p.write_text(text[:start] + text[end:])
          text = p.read_text()
          observer = "\n    const profileBars=document.getElementById('profileBars');\n    if(profileBars)new MutationObserver(simplifySignalCards).observe(profileBars,{childList:true,subtree:true});"
          replace_once('project-enhancements.js', observer, '')

          # quiz-ui-tweaks.css: remove the dead playstyle styling while retaining
          # the existing global polish and the community-results card treatment.
          p = Path('quiz-ui-tweaks.css')
          text = p.read_text()
          marker = '\n/* Make playstyle signals read as two explicit preference bars'
          start = text.index(marker)
          p.write_text(text[:start] + '\n')
          with p.open('a') as f:
              f.write('''/* Results sections use one consistent vertical rhythm. The existing top spacing remains unchanged. */\n#results > .job-matches-panel,\n#results > .detail-panel {\n  margin-top:14px;\n}\n#results > .results-hero + .job-matches-panel {\n  margin-top:14px;\n}\n#results > .detail-panel + .shared-stats-panel {\n  margin-top:14px;\n}\n#results > .site-footer {\n  margin-top:0;\n}\n''')

          # e2e tests: assert the playstyle UI is gone and the new community heading exists.
          p = Path('tests/e2e/quiz.spec.js')
          text = p.read_text()
          marker = "test('playstyle signals compare two explicit bars without the old marker'"
          start = text.index(marker)
          end = text.index("\ntest('results-page community rankings reuse the compact popup layout'", start)
          replacement = '''test('results no longer render the redundant playstyle section or signal markup', async ({ page }) => {\n  await mockStats(page, { page: 1 });\n  await page.goto('/index.html');\n  await advanceToResults(page, 48);\n\n  await expect(page.locator('.playstyle-panel')).toHaveCount(0);\n  await expect(page.locator('#profileBars')).toHaveCount(0);\n  await expect(page.locator('.signal-card')).toHaveCount(0);\n  await expect(page.locator('.signal-marker')).toHaveCount(0);\n});\n\n'''
          text = text[:start] + replacement + text[end + 1:]
          anchor = "  const rows = page.locator('.shared-stats-panel .stats-row');\n"
          addition = "  await expect(page.locator('.shared-stats-panel h3')).toHaveText('Community Results');\n  await expect(page.locator('.shared-stats-panel .panel-mark')).toHaveCount(0);\n\n"
          if text.count(anchor) != 1:
              raise SystemExit('tests/e2e/quiz.spec.js: community test anchor not found')
          p.write_text(text.replace(anchor, addition + anchor))
          PY

      - name: Verify changed files
        run: |
          test "$(grep -o 'Your Playstyle' index.html | wc -l)" -eq 1
          ! grep -q 'playstyle-panel' index.html
          ! grep -q 'profileBars' index.html
          ! grep -q 'COMMUNITY COUNTER' index.html
          grep -q '>Community Results<' index.html
          ! grep -q 'simplifySignalCards' project-enhancements.js
          ! grep -q 'profileBars' project-enhancements.js
          ! grep -q 'playstyle-panel' quiz-ui-tweaks.css
          grep -q '#results > .detail-panel + .shared-stats-panel' quiz-ui-tweaks.css

      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html app.js project-enhancements.js quiz-ui-tweaks.css tests/e2e/quiz.spec.js
          git commit -m 'Apply results cleanup'
          git push