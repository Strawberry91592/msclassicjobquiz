name: Deploy Stats Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-stats-worker.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Deploy Cloudflare Worker
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          secrets: |
            ACCOUNT_ID
            ANALYTICS_READ_TOKEN
        env:
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ANALYTICS_READ_TOKEN: ${{ secrets.ANALYTICS_READ_TOKEN }}

      - name: Connect the live site to the Worker
        env:
          WORKER_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          test -n "$WORKER_URL"
          python - <<'PY'
          from pathlib import Path
          import os
          path = Path('config.js')
          text = path.read_text()
          url = os.environ['WORKER_URL'].rstrip('/')
          lines = text.splitlines()
          replaced = False
          for i, line in enumerate(lines):
              if line.strip().startswith('window.STATS_API_URL'):
                  lines[i] = f"window.STATS_API_URL = {url!r};"
                  replaced = True
                  break
          if not replaced:
              raise SystemExit('STATS_API_URL was not found in config.js')
          path.write_text('\n'.join(lines) + '\n')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config.js
          if git diff --cached --quiet; then
            echo 'Worker URL is already connected.'
          else
            git commit -m 'Connect quiz stats counter to Worker'
            git push
          fi
