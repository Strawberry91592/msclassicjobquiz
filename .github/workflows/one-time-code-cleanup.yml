name: One-time code cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-code-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout triggering revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Remove redundant result and startup code
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def remove_once(text, start_marker, end_marker):
              start = text.find(start_marker)
              if start < 0:
                  raise SystemExit(f'Start marker not found: {start_marker!r}')
              end = text.find(end_marker, start)
              if end < 0:
                  raise SystemExit(f'End marker not found: {end_marker!r}')
              return text[:start] + text[end:]

          def remove_css_rule(text, selector):
              marker = selector + '{'
              start = text.find(marker)
              if start < 0:
                  raise SystemExit(f'CSS selector not found: {selector!r}')
              brace = start + len(selector)
              depth = 0
              end = None
              for i in range(brace, len(text)):
                  if text[i] == '{':
                      depth += 1
                  elif text[i] == '}':
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break
              if end is None:
                  raise SystemExit(f'Unbalanced CSS rule: {selector!r}')
              return text[:start] + text[end:]

          # Remove the redundant Road section from the actual HTML.
          path = 'index.html'
          text = read(path)
          road_start = '        <section class="panel detail-panel">\n          <div class="panel-head"><div><h3>Your Road Through Maple World</h3>'
          text = remove_once(text, road_start, '        </section>')
          text = text.replace('\n  <script src="beginner-stats-fix.js"></script>', '')
          write(path, text)

          # Remove now-dead references from the application and make the Beginner path
          # use the same active stats loader as normal results.
          path = 'app.js'
          text = read(path)
          text = text.replace("    hide($('modeModal'));\n", '', 1)
          text = remove_once(text, "    $('progressionFit').innerHTML = `", '    const alternatives =')
          text = remove_once(text, '    const alternatives =', '    renderSharedStats();')
          old = "    renderSharedStats();\n    hide($('quiz')); show($('results'));"
          new = "    refreshSharedStats();\n    hide($('quiz')); show($('results'));"
          if old not in text:
              raise SystemExit('Beginner stats call site not found in app.js')
          text = text.replace(old, new, 1)
          write(path, text)

          # Remove progression metadata that has no remaining consumer.
          path = 'classes.js'
          obj = json.loads(read(path).split('window.CLASS_DATA = ', 1)[1].split(';\nwindow.QUIZ_DIMS', 1)[0])
          if len(obj) != 10 or not all('road' in cls for cls in obj.values()):
              raise SystemExit('Expected exactly 10 class road metadata blocks')
          for cls in obj.values():
              del cls['road']
          prefix = '/* MapleStory Classic World • Job 1-2 class profiles and quiz scoring model.\n   Profiles are grounded in current NiaMeowDB Job 1-2 data. Third-job mechanics are excluded. */\n'
          original = read(path)
          suffix = original.split(';\nwindow.QUIZ_DIMS', 1)[1]
          write(path, prefix + 'window.CLASS_DATA = ' + json.dumps(obj, separators=(',', ':'), ensure_ascii=False) + ';\nwindow.QUIZ_DIMS' + suffix)

          # The opening-community enhancement is already absent on the current tree. Do not
          # manufacture unrelated edits if that dead block is already gone.
          path = 'project-enhancements.js'
          if any(token in read(path) for token in ('openingCommunity', 'ensureOpeningPanel', 'JOB_ORDER')):
              raise SystemExit('Unexpected stale opening-community enhancement code remains')

          # Remove old modal CSS and progression CSS. These selectors have no remaining DOM users.
          path = 'styles.css'
          text = read(path)
          start = text.find('.modal-backdrop{')
          note = text.find('.modal-note{', start)
          if start < 0 or note < 0:
              raise SystemExit('Obsolete modal CSS block not found')
          end = text.find('}', note)
          if end < 0:
              raise SystemExit('Malformed modal CSS block')
          text = text[:start] + text[end + 1:]
          text = text.replace('.eyebrow,.mode-kicker,.section-label{', '.eyebrow,.section-label{')
          text = text.replace('.detail-list,.progression-grid,.shared-stats{', '.detail-list,.shared-stats{')
          text = text.replace('.detail-item,.stage,.stats-row,.community-eligibility{', '.detail-item,.stats-row,.community-eligibility{')
          text = text.replace('.intro-cards,.result-grid-top,.progression-grid{', '.intro-cards,.result-grid-top{')
          text = text.replace('body.night-mode .stage h4,', '')
          text = text.replace(',body.night-mode .stage p{', '{')
          text = text.replace('body.night-mode .mode-card,', '')
          for selector in ('.progression-grid', '.stage h4', '.stage p'):
              text = remove_css_rule(text, selector)
          write(path, text)

          # Add a regression test for the actual absence of the removed section.
          path = 'tests/e2e/quiz.spec.js'
          text = read(path)
          if 'results omit the redundant progression section' not in text:
              marker = "test('results-page community rankings reuse the compact popup layout', async ({ page }) => {"
              if marker not in text:
                  raise SystemExit('Expected community-layout test marker not found')
              regression = """test('results omit the redundant progression section', async ({ page }) => {\n  await mockStats(page, { assassin: 1 });\n  await page.goto('/index.html');\n  await advanceToResults(page, 30);\n  await expect(page.locator('#results')).toBeVisible();\n  await expect(page.locator('#progressionFit')).toHaveCount(0);\n  await expect(page.locator('.stage')).toHaveCount(0);\n});\n\n"""
              text = text.replace(marker, regression + marker, 1)
          write(path, text)

          # Delete the temporary workflow itself. The cleanup commit leaves the repository
          # in the desired permanent state without this helper.
          Path('.github/workflows/one-time-code-cleanup.yml').unlink()

          checks = {
              'index.html': ['Your Road Through Maple World', 'progressionFit', 'beginner-stats-fix.js'],
              'app.js': ['progressionFit', "hide($('modeModal'))", "const alternatives = $('alternatives')"],
              'classes.js': ['"road"'],
              'project-enhancements.js': ['openingCommunity', 'ensureOpeningPanel', 'JOB_ORDER'],
              'styles.css': ['.progression-grid', '.stage', '.modal-backdrop', '.mode-modal', '.mode-card', '.mode-kicker'],
              '.github/workflows/one-time-code-cleanup.yml': [],
          }
          for file, needles in checks.items():
              if not Path(file).exists():
                  if needles:
                      raise SystemExit(f'Expected file is missing: {file}')
                  continue
              source = read(file)
              for needle in needles:
                  if needle in source:
                      raise SystemExit(f'Obsolete source remains: {needle!r} in {file}')

          app = read('app.js')
          if "refreshSharedStats();\n    hide($('quiz')); show($('results'));" not in app:
              raise SystemExit('Beginner result does not directly refresh community stats')

          print('Source cleanup validation passed.')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove redundant progression and dead result code'
          git push
