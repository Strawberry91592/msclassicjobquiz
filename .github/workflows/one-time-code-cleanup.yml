name: One-time code cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-code-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout triggering revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Remove redundant result and startup code
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          # index.html: remove the actual Road section and the temporary Beginner workaround.
          path = 'index.html'
          text = read(path)
          text, count = re.subn(
              r'\n        <section class="panel detail-panel">\n'
              r'          <div class="panel-head"><div><h3>Your Road Through Maple World</h3>'
              r'<p>How the fit lines up from early game through your 2nd Job</p></div></div>\n'
              r'          <div id="progressionFit" class="progression-grid"></div>\n'
              r'        </section>',
              '',
              text,
              count=1,
              flags=re.MULTILINE,
          )
          if count != 1:
              raise SystemExit(f'Expected Road section in index.html, removed {count}')
          text = text.replace('\n  <script src="beginner-stats-fix.js"></script>', '')
          write(path, text)

          # app.js: integrate the Beginner stats refresh directly, then remove dead DOM references.
          path = 'app.js'
          text = read(path)
          text, count = re.subn(r"    hide\(\$\('modeModal'\)\);\n", '', text, count=1)
          if count != 1:
              raise SystemExit('Expected obsolete modeModal startup line in app.js')
          text, count = re.subn(r"\n    \$\('progressionFit'\)\.innerHTML = `.*?`;", '', text, count=1, flags=re.DOTALL)
          if count != 1:
              raise SystemExit('Expected progressionFit rendering block in app.js')
          text, count = re.subn(r"\n    const alternatives = \$\('alternatives'\);\n    if \(alternatives\) alternatives\.innerHTML = `.*?`;", '', text, count=1, flags=re.DOTALL)
          if count != 1:
              raise SystemExit('Expected dead alternatives block in app.js')
          text, count = re.subn(
              r"    renderSharedStats\(\);\n    hide\(\$('quiz'\)\); show\(\$('results'\);", '', text, count=0)
          # Replace only the Beginner call site by anchoring it to the subsequent hide(results) line.
          text, count = re.subn(
              r"    renderSharedStats\(\);\n    hide\(\$('quiz'\)\); show\(\$('results'\)\);",
              "    refreshSharedStats();\n    hide($('quiz')); show($('results'));",
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('Expected Beginner renderSharedStats call site in app.js')
          write(path, text)

          # classes.js: road metadata existed solely for the removed results section.
          path = 'classes.js'
          text = read(path)
          text, count = re.subn(r',"road":\{"early":"[^"]*","second":"[^"]*"\}', '', text)
          if count != 10:
              raise SystemExit(f'Expected 10 road metadata blocks in classes.js, removed {count}')
          write(path, text)

          # project-enhancements.js is already cleaned on current main; fail only if stale opening code remains.
          path = 'project-enhancements.js'
          text = read(path)
          stale = ('openingCommunity', 'ensureOpeningPanel', 'JOB_ORDER')
          if any(token in text for token in stale):
              raise SystemExit('Stale opening-community enhancement code is still present in project-enhancements.js')
          write(path, text)

          # styles.css: remove modal and progression styles that no longer have DOM users.
          path = 'styles.css'
          text = read(path)
          text, count = re.subn(r'\.modal-backdrop\{.*?\.modal-note\{[^}]*\}', '', text, count=1, flags=re.DOTALL)
          if count != 1:
              raise SystemExit('Expected obsolete modal styles in styles.css')
          for old, new in [
              ('.eyebrow,.mode-kicker,.section-label{', '.eyebrow,.section-label{'),
              ('.detail-list,.progression-grid,.shared-stats{', '.detail-list,.shared-stats{'),
              ('.detail-item,.stage,.stats-row,.community-eligibility{', '.detail-item,.stats-row,.community-eligibility{'),
              ('.intro-cards,.result-grid-top,.progression-grid{', '.intro-cards,.result-grid-top{'),
              ('body.night-mode .stage h4,', ''),
              (',body.night-mode .stage p{', '{'),
              ('body.night-mode .mode-card,', ''),
          ]:
              text = text.replace(old, new)
          for selector in (r'\.progression-grid\{[^}]*\}', r'\.stage h4\{[^}]*\}', r'\.stage p\{[^}]*\}'):
              text = re.sub(selector, '', text, count=1)
          write(path, text)

          # tests/e2e: protect the removal from regression.
          path = 'tests/e2e/quiz.spec.js'
          text = read(path)
          marker = "test('results-page community rankings reuse the compact popup layout', async ({ page }) => {"
          test_block = """test('results omit the redundant progression section', async ({ page }) => {\n  await mockStats(page, { assassin: 1 });\n  await page.goto('/index.html');\n  await advanceToResults(page, 30);\n  await expect(page.locator('#results')).toBeVisible();\n  await expect(page.locator('#progressionFit')).toHaveCount(0);\n  await expect(page.locator('.stage')).toHaveCount(0);\n});\n\n"""
          if 'results omit the redundant progression section' not in text:
              if marker not in text:
                  raise SystemExit('Expected E2E insertion point was not found')
              text = text.replace(marker, test_block + marker, 1)
          write(path, text)

          # Remove the standalone workaround file. It is now unnecessary because app.js owns the stats refresh.
          fix = Path('beginner-stats-fix.js')
          if fix.exists():
              fix.unlink()

          checks = {
              'index.html': ['Your Road Through Maple World', 'progressionFit', 'beginner-stats-fix.js'],
              'app.js': ['progressionFit', "hide($('modeModal'))", "const alternatives = $('alternatives')"],
              'classes.js': ['"road"'],
              'project-enhancements.js': ['openingCommunity', 'ensureOpeningPanel', 'JOB_ORDER'],
              'styles.css': ['.progression-grid', '.stage', '.modal-backdrop', '.mode-modal', '.mode-card', '.mode-kicker'],
          }
          for file, needles in checks.items():
              source = read(file)
              for needle in needles:
                  if needle in source:
                      raise SystemExit(f'Obsolete source remains: {needle!r} in {file}')

          app = read('app.js')
          if "refreshSharedStats();\n    hide($('quiz')); show($('results'));" not in app:
              raise SystemExit('Beginner result does not directly refresh community stats')

          print('Source cleanup validation passed.')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html app.js classes.js project-enhancements.js styles.css tests/e2e/quiz.spec.js beginner-stats-fix.js .github/workflows/one-time-code-cleanup.yml
          git commit -m 'Remove redundant progression and dead result code'
          git push
