name: One-time code cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-code-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout triggering revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Remove redundant result and startup code
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def remove_between(text, start_marker, end_marker, include_end=False):
              start = text.find(start_marker)
              if start < 0:
                  raise SystemExit(f'Expected start marker not found: {start_marker!r}')
              end = text.find(end_marker, start)
              if end < 0:
                  raise SystemExit(f'Expected end marker not found: {end_marker!r}')
              end += len(end_marker) if include_end else 0
              return text[:start] + text[end:]

          def remove_css_rule(text, selector):
              start = text.find(selector + '{')
              if start < 0:
                  raise SystemExit(f'Expected CSS selector not found: {selector!r}')
              brace = text.find('{', start)
              depth = 0
              for i in range(brace, len(text)):
                  if text[i] == '{':
                      depth += 1
                  elif text[i] == '}':
                      depth -= 1
                      if depth == 0:
                          return text[:start] + text[i + 1:]
              raise SystemExit(f'Unbalanced CSS rule: {selector!r}')

          # index.html
          path = 'index.html'
          text = read(path)
          road_start = '        <section class="panel detail-panel">\n          <div class="panel-head"><div><h3>Your Road Through Maple World</h3>'
          road_end = '        </section>'
          text = remove_between(text, road_start, road_end, include_end=True)
          text = text.replace('\n  <script src="beginner-stats-fix.js"></script>', '')
          write(path, text)

          # app.js
          path = 'app.js'
          text = read(path)
          obsolete = "    hide($('modeModal'));\n"
          if obsolete not in text:
              raise SystemExit('Obsolete modeModal line was not found in app.js')
          text = text.replace(obsolete, '', 1)

          progression_start = "    $('progressionFit').innerHTML = `"
          progression_end = '    const alternatives ='
          text = remove_between(text, progression_start, progression_end, include_end=False)
          alternatives_start = '    const alternatives ='
          stats_start = '    renderSharedStats();'
          text = remove_between(text, alternatives_start, stats_start, include_end=False)
          old_stats = "    renderSharedStats();\n    hide($('quiz')); show($('results'));"
          new_stats = "    refreshSharedStats();\n    hide($('quiz')); show($('results'));"
          if old_stats not in text:
              raise SystemExit('Beginner stats call site was not found in app.js')
          text = text.replace(old_stats, new_stats, 1)
          write(path, text)

          # classes.js
          path = 'classes.js'
          text = read(path)
          text, count = re.subn(r',"road":\{"early":"[^"]*","second":"[^"]*"\}', '', text)
          if count != 10:
              raise SystemExit(f'Expected 10 road metadata blocks in classes.js, removed {count}')
          write(path, text)

          # styles.css: the old landing-modal rules form one contiguous block from
          # .modal-backdrop through .modal-note. Remove it as actual dead CSS.
          path = 'styles.css'
          text = read(path)
          start = text.find('.modal-backdrop{')
          note = text.find('.modal-note{', start)
          if start < 0 or note < 0:
              raise SystemExit('Obsolete modal CSS block was not found')
          end = text.find('}', note)
          if end < 0:
              raise SystemExit('Malformed modal CSS block')
          text = text[:start] + text[end + 1:]

          for old, new in [
              ('.eyebrow,.mode-kicker,.section-label{', '.eyebrow,.section-label{'),
              ('.detail-list,.progression-grid,.shared-stats{', '.detail-list,.shared-stats{'),
              ('.detail-item,.stage,.stats-row,.community-eligibility{', '.detail-item,.stats-row,.community-eligibility{'),
              ('.intro-cards,.result-grid-top,.progression-grid{', '.intro-cards,.result-grid-top{'),
              ('body.night-mode .stage h4,', ''),
              (',body.night-mode .stage p{', '{'),
              ('body.night-mode .mode-card,', ''),
          ]:
              text = text.replace(old, new)

          for selector in ('.progression-grid', '.stage h4', '.stage p'):
              text = remove_css_rule(text, selector)
          write(path, text)

          # tests/e2e: lock the removal in with a regression test.
          path = 'tests/e2e/quiz.spec.js'
          text = read(path)
          if 'results omit the redundant progression section' not in text:
              marker = "test('results-page community rankings reuse the compact popup layout', async ({ page }) => {"
              if marker not in text:
                  raise SystemExit('Expected E2E insertion point was not found')
              test_block = """test('results omit the redundant progression section', async ({ page }) => {\n  await mockStats(page, { assassin: 1 });\n  await page.goto('/index.html');\n  await advanceToResults(page, 30);\n  await expect(page.locator('#results')).toBeVisible();\n  await expect(page.locator('#progressionFit')).toHaveCount(0);\n  await expect(page.locator('.stage')).toHaveCount(0);\n});\n\n"""
              text = text.replace(marker, test_block + marker, 1)
          write(path, text)

          Path('beginner-stats-fix.js').unlink(missing_ok=True)

          forbidden = {
              'index.html': ['Your Road Through Maple World', 'progressionFit', 'beginner-stats-fix.js'],
              'app.js': ['progressionFit', "hide($('modeModal'))", "const alternatives = $('alternatives')"],
              'classes.js': ['"road"'],
              'project-enhancements.js': ['openingCommunity', 'ensureOpeningPanel', 'JOB_ORDER'],
              'styles.css': ['.progression-grid', '.stage', '.modal-backdrop', '.mode-modal', '.mode-card', '.mode-kicker'],
          }
          for file, needles in forbidden.items():
              source = read(file)
              for needle in needles:
                  if needle in source:
                      raise SystemExit(f'Obsolete source remains: {needle!r} in {file}')

          app = read('app.js')
          if "refreshSharedStats();\n    hide($('quiz')); show($('results'));" not in app:
              raise SystemExit('Beginner result does not directly refresh community stats')

          print('Source cleanup validation passed.')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html app.js classes.js styles.css tests/e2e/quiz.spec.js beginner-stats-fix.js .github/workflows/one-time-code-cleanup.yml
          git commit -m 'Remove redundant progression and dead result code'
          git push
