name: One-time code cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-code-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout triggering revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Remove redundant result and startup code
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def remove_between(text, start_marker, end_marker):
              start = text.find(start_marker)
              if start < 0:
                  raise SystemExit(f'Start marker not found: {start_marker!r}')
              end = text.find(end_marker, start)
              if end < 0:
                  raise SystemExit(f'End marker not found: {end_marker!r}')
              return text[:start] + text[end:]

          def remove_css_rule(text, selector):
              marker = selector + '{'
              start = text.find(marker)
              if start < 0:
                  raise SystemExit(f'CSS selector not found: {selector!r}')
              brace = start + len(selector)
              depth = 0
              for i in range(brace, len(text)):
                  if text[i] == '{':
                      depth += 1
                  elif text[i] == '}':
                      depth -= 1
                      if depth == 0:
                          return text[:start] + text[i + 1:]
              raise SystemExit(f'Unbalanced CSS rule: {selector!r}')

          # Remove the actual HTML section, not merely hide it.
          path = 'index.html'
          text = read(path)
          road_start = '        <section class="panel detail-panel">\n          <div class="panel-head"><div><h3>Your Road Through Maple World</h3>'
          text = remove_between(text, road_start, '        </section>')
          text = text.replace('\n  <script src="beginner-stats-fix.js"></script>', '')
          write(path, text)

          # Remove all progression rendering and stale DOM compatibility code from app.js.
          path = 'app.js'
          text = read(path)
          text = text.replace("    hide($('modeModal'));\n", '', 1)
          progression = "    $('progressionFit').innerHTML = `"
          if progression not in text:
              raise SystemExit('No progression renderer found in app.js')
          while progression in text:
              start = text.find(progression)
              alternatives_pos = text.find('    const alternatives =', start)
              stats_pos = text.find('    renderSharedStats();', start)
              if alternatives_pos >= 0 and (stats_pos < 0 or alternatives_pos < stats_pos):
                  end = alternatives_pos
              elif stats_pos >= 0:
                  end = stats_pos
              else:
                  raise SystemExit('Could not locate end of progression rendering block')
              text = text[:start] + text[end:]
          while '    const alternatives =' in text:
              text = remove_between(text, '    const alternatives =', '    renderSharedStats();')
          old_stats = "    renderSharedStats();\n    hide($('quiz')); show($('results'));"
          new_stats = "    refreshSharedStats();\n    hide($('quiz')); show($('results'));"
          if old_stats not in text:
              raise SystemExit('Beginner stats call site not found in app.js')
          text = text.replace(old_stats, new_stats, 1)
          write(path, text)

          # Remove progression metadata that no longer has a consumer.
          path = 'classes.js'
          original = read(path)
          boundary = ';\nwindow.QUIZ_DIMS'
          if boundary not in original:
              raise SystemExit('QUIZ_DIMS boundary not found in classes.js')
          left, suffix = original.split(boundary, 1)
          prefix, payload = left.split('window.CLASS_DATA = ', 1)
          data = json.loads(payload)
          if len(data) != 10 or not all('road' in cls for cls in data.values()):
              raise SystemExit('Expected exactly 10 class road metadata blocks')
          for cls in data.values():
              del cls['road']
          write(path, prefix + 'window.CLASS_DATA = ' + json.dumps(data, separators=(',', ':'), ensure_ascii=False) + boundary + suffix)

          # project-enhancements.js was already source-cleaned; do not modify active code here.
          if any(token in read('project-enhancements.js') for token in ('openingCommunity', 'ensureOpeningPanel', 'JOB_ORDER')):
              raise SystemExit('Unexpected stale opening-community code remains in project-enhancements.js')

          # Remove the old landing modal CSS block and progression-specific CSS rules.
          path = 'styles.css'
          text = read(path)
          start = text.find('.modal-backdrop{')
          note = text.find('.modal-note{', start)
          if start < 0 or note < 0:
              raise SystemExit('Obsolete modal CSS block not found')
          end = text.find('}', note)
          if end < 0:
              raise SystemExit('Malformed modal CSS block')
          text = text[:start] + text[end + 1:]
          for selector in ('.progression-grid', '.stage h4', '.stage p'):
              text = remove_css_rule(text, selector)
          text = text.replace('.eyebrow,.mode-kicker,.section-label{', '.eyebrow,.section-label{')
          text = text.replace('.detail-list,.progression-grid,.shared-stats{', '.detail-list,.shared-stats{')
          text = text.replace('.detail-item,.stage,.stats-row,.community-eligibility{', '.detail-item,.stats-row,.community-eligibility{')
          text = text.replace('.intro-cards,.result-grid-top,.progression-grid{', '.intro-cards,.result-grid-top{')
          text = text.replace('body.night-mode .stage h4,', '')
          text = text.replace('body.night-mode .stage p,', '')
          text = text.replace(',body.night-mode .stage p{', '{')
          text = text.replace('body.night-mode .mode-card,', '')
          write(path, text)

          # Protect the permanent removal with an end-to-end regression test.
          path = 'tests/e2e/quiz.spec.js'
          text = read(path)
          if 'results omit the redundant progression section' not in text:
              marker = "test('results-page community rankings reuse the compact popup layout', async ({ page }) => {"
              if marker not in text:
                  raise SystemExit('Expected compact-layout test marker not found')
              regression = """test('results omit the redundant progression section', async ({ page }) => {\n  await mockStats(page, { assassin: 1 });\n  await page.goto('/index.html');\n  await advanceToResults(page, 30);\n  await expect(page.locator('#results')).toBeVisible();\n  await expect(page.locator('#progressionFit')).toHaveCount(0);\n  await expect(page.locator('.stage')).toHaveCount(0);\n});\n\n"""
              text = text.replace(marker, regression + marker, 1)
          write(path, text)

          # Permanently remove this temporary cleanup workflow in the same commit.
          Path('.github/workflows/one-time-code-cleanup.yml').unlink(missing_ok=True)

          forbidden = {
              'index.html': ['Your Road Through Maple World', 'progressionFit', 'beginner-stats-fix.js'],
              'app.js': ['progressionFit', "hide($('modeModal'))", "const alternatives = $('alternatives')"],
              'classes.js': ['"road"'],
              'project-enhancements.js': ['openingCommunity', 'ensureOpeningPanel', 'JOB_ORDER'],
              'styles.css': ['.progression-grid', '.stage h4', '.stage p', '.detail-item,.stage,', '.modal-backdrop', '.mode-modal', '.mode-card', '.mode-kicker'],
          }
          for file, needles in forbidden.items():
              if not Path(file).exists():
                  raise SystemExit(f'Expected source file missing: {file}')
              source = read(file)
              for needle in needles:
                  if needle in source:
                      raise SystemExit(f'Obsolete source remains: {needle!r} in {file}')

          app = read('app.js')
          if "refreshSharedStats();\n    hide($('quiz')); show($('results'));" not in app:
              raise SystemExit('Beginner result does not directly refresh community stats')

          print('Source cleanup validation passed.')
          PY

          node --check app.js
          node --check project-enhancements.js
          node --check community-client-key.js
          node --check community-rankings.js
          node tests/model.test.cjs

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove redundant progression and dead result code'
          git push
