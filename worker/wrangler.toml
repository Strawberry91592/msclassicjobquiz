name = "maplestory-classic-quiz-stats"
main = "worker.js"
compatibility_date = "2026-09-01"

[vars]
ALLOWED_ORIGIN = "https://strawberry91592.github.io"
DATASET_NAME = "classic_quiz_results"

[secrets]
required = ["ACCOUNT_ID", "ANALYTICS_READ_TOKEN"]

[[analytics_engine_datasets]]
binding = "RESULTS"
dataset = "classic_quiz_results"
