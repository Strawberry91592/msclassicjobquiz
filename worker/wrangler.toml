name = "maplestory-classic-quiz-stats"
main = "worker.js"
compatibility_date = "2026-09-01"

[vars]
ALLOWED_ORIGIN = "https://strawberry91592.github.io"
DATASET_NAME = "classic_quiz_results"

[secrets]
required = ["ACCOUNT_ID", "ANALYTICS_READ_TOKEN"]

[[analytics_engine_datasets]]
binding = "RESULTS"
dataset = "classic_quiz_results"

# Abuse protection for anonymous community-result submissions.
# Two accepted calls per minute per client key is enough to stop rapid scripted
# inflation while still allowing a genuine user to retake the quiz.
[[ratelimits]]
name = "SUBMISSION_RATE_LIMITER"
namespace_id = "923847161"

  [ratelimits.simple]
  limit = 2
  period = 60
