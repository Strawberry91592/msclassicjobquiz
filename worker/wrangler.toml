name = "maplestory-classic-quiz-stats"
main = "worker.js"
compatibility_date = "2026-09-01"

[vars]
ALLOWED_ORIGIN = "https://strawberry91592.github.io"
DATASET_NAME = "classic_quiz_results"
# Community results before this UTC timestamp are test data and are excluded
# from the public aggregate. New submissions after the cutoff are counted.
COMMUNITY_RESET_AT = "2026-09-08 13:48:00"

[secrets]
required = ["ACCOUNT_ID", "ANALYTICS_READ_TOKEN"]

[[analytics_engine_datasets]]
binding = "RESULTS"
dataset = "classic_quiz_results"

# Abuse protection for anonymous community-result submissions.
# A stable anonymous browser key keeps normal users behind shared IP addresses
# independent, while the broader IP limiter prevents one network from creating
# unlimited fresh browser keys and hammering the endpoint.
[[ratelimits]]
name = "CLIENT_RATE_LIMITER"
namespace_id = "923847161"

  [ratelimits.simple]
  limit = 2
  period = 60

[[ratelimits]]
name = "IP_RATE_LIMITER"
namespace_id = "923847162"

  [ratelimits.simple]
  limit = 20
  period = 60
